<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="pilot-show.css"><style>
.overviewHeading{display:flex;gap:8px;align-items:flex-start}.overviewHeading .overviewName{flex:1;min-width:0}.editCue{padding:2px 7px!important;border:0!important;background:transparent!important;color:#a9c8e8!important;font-size:18px!important;cursor:pointer;flex:none}.editCue:hover,.editCue:focus-visible{background:#30425b!important;outline:2px solid #91c4ff!important}.editCue:disabled{opacity:.35;cursor:default}

#showNextCountdown[hidden]{display:none!important}
body.locked main{padding:16px!important}body.locked .timelineCard{margin-top:0}.timelineTransport>.row{pointer-events:none}.timeline{flex:1}.showOverviewRow .overviewVisual img{cursor:zoom-in}.overviewVisual button{padding:0;border:0;background:none;width:100%;height:100%;border-radius:inherit;cursor:zoom-in;display:block}.overviewVisual button:focus-visible{outline:3px solid #a9d4ff;outline-offset:-3px}.overviewVisual button img{object-fit:cover}#showCueOverviewRows{min-height:160px}body.lost .overviewBeat{animation:none!important;opacity:0!important}#standbyNotice{color:#a9bbd0;font-size:13px;margin-top:8px}#showNextCountdown{margin:0 auto}#timeline{position:relative;width:100%}#clock{font-variant-numeric:tabular-nums}body.locked #showCueOverviewRows{overflow:visible!important}.showCueOverview{overflow:visible!important}.showOverviewRow.isActive .overviewVisual img{transition:opacity .25s linear}body{overflow-y:auto}
@keyframes bridgeUrgent{0%,100%{opacity:.2}50%{opacity:1}}body.nextCueUrgent:not(.lost) .isNext .overviewBeat,body.nextCueUrgent:not(.lost) #showNextCountdown>.overviewBeat{animation:bridgeUrgent 1s ease-in-out infinite} @media(prefers-reduced-motion:reduce){body.nextCueUrgent .overviewBeat{animation:none!important;opacity:1}}
</style></head><body class="locked"><main class="spectaclePriorityLayout"><section class="card timelineCard"><div class="timelineTransport"><div class="showTransportHeader"><h2 class="timelineShowTitle" id="title"></h2><div class="showNextCountdown" id="showNextCountdown"><span class="showCountdownLabel"></span><span class="showCountdownClock">--:--</span><span class="overviewBeat"></span></div></div><div class="row"><div id="generalTimelineViewport"><div class="timeline" id="timeline"><div id="progress" class="progress"></div></div></div><span class="transportClock"><span class="time" id="clock">00:00</span><span class="muted" id="duration"></span></span></div><div id="standbyNotice"></div></div></section><div class="showWorkspace"><section class="card showCueOverview"><h2>CUES</h2><div id="showCueOverviewRows"></div></section></div></main><script src="show.js"></script></body></html>
