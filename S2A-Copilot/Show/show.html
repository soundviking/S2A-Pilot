<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="pilot-show.css"><style>
.overviewHeading{display:flex;gap:8px;align-items:flex-start}.overviewHeading .overviewName{flex:1;min-width:0}.editCue{padding:2px 7px!important;border:0!important;background:transparent!important;color:#a9c8e8!important;font-size:18px!important;cursor:pointer;flex:none}.editCue:hover,.editCue:focus-visible{background:#30425b!important;outline:2px solid #91c4ff!important}.editCue:disabled{opacity:.35;cursor:default}

.bridgeShowHeading{flex:1;min-width:0}.bridgeShowHeading h2{margin-bottom:0}#liveFinishEstimate{margin-top:8px;font-size:13px;font-variant-numeric:tabular-nums}#liveFinishEstimate[hidden]{display:none!important}
#showNextCountdown[hidden]{display:none!important}
body.locked main{padding:16px!important}body.locked .timelineCard{margin-top:0}.timelineTransport>.row{pointer-events:none}.timeline{flex:1}.showOverviewRow .overviewVisual img{cursor:zoom-in}.overviewVisual button{padding:0;border:0;background:none;width:100%;height:100%;border-radius:inherit;cursor:zoom-in;display:block}.overviewVisual button:focus-visible{outline:3px solid #a9d4ff;outline-offset:-3px}.overviewVisual button img{object-fit:cover}#showCueOverviewRows{min-height:160px}body.lost .overviewBeat{animation:none!important;opacity:0!important}#standbyNotice{color:#a9bbd0;font-size:13px;margin-top:8px}#showNextCountdown{margin:0 auto}#timeline{position:relative;width:100%}#clock{font-variant-numeric:tabular-nums}body.locked #showCueOverviewRows{overflow:visible!important}.showCueOverview{overflow:visible!important}.showOverviewRow.isActive .overviewVisual img{transition:opacity .25s linear}body{overflow-y:auto}
body.nextCueUrgent:not(.lost) .isNext .overviewBeat,body.nextCueUrgent:not(.lost) #showNextCountdown>.overviewBeat{opacity:var(--bridge-cue-beat,0)} @media(prefers-reduced-motion:reduce){body.nextCueUrgent .overviewBeat{opacity:1!important}}

/* QLab cues use Pilot's Iceman layout; no countdown column is reserved. */
body.locked.showLayoutIceman .showOverviewRow.isNext{grid-template-columns:24px minmax(0,22.5vw) 58px minmax(0,1fr)}
@media(max-width:900px){body.locked.showLayoutIceman .showOverviewRow.isNext{grid-template-columns:20px minmax(0,22.5vw) 42px minmax(0,1fr)}}
@media(max-width:760px), (min-width:761px) and (orientation:portrait){
 body.locked.showLayoutIceman .showOverviewRow.isActive,body.locked.showLayoutIceman .showOverviewRow.isNext{grid-template-columns:20px minmax(0,22.5vw) minmax(0,1fr)}
 body.locked.showLayoutIceman .showOverviewRow.isActive .overviewHeading{grid-column:3;grid-row:1/3;align-self:start}
 body.locked.showLayoutIceman .showOverviewRow.isNext .overviewHeading{grid-column:1/-1;grid-row:3}
 body.locked.showLayoutIceman .showOverviewRow.isNext .overviewDescription{grid-column:1/-1;grid-row:4}
}
.timelineTransport>.row{display:flex;flex-wrap:wrap}.timelineTransport>.row>#generalTimelineViewport{flex:0 0 100%;min-width:0}.timelineTransport>.row>.transportClock{margin-left:auto;justify-content:flex-end;text-align:right;margin-top:12px;pointer-events:none}.bridgeCueHeading{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.bridgeCueHeading h2{margin:0}#cueTypeFilter{position:relative;font-size:14px}#cueTypeFilter summary{cursor:pointer;background:#232c3b;border:1px solid #4c5c73;border-radius:8px;padding:10px 14px}#cueTypeFilter[open]{z-index:10}#cueTypeFilter>div,#cueTypeFilter>button{background:#18212e}#cueTypeChoices{padding:8px 14px;max-height:45vh;overflow:auto}#cueTypeChoices label{display:flex;gap:8px;margin:8px 0;cursor:pointer}#cueTypeAll{width:100%;padding:8px;color:#c2ddff;border:1px solid #4c5c73;cursor:pointer}.bridgeTypeBadge{font-size:.65em;margin-right:8px;white-space:nowrap}
.showOverviewPlaceholder{display:flex;align-items:center;justify-content:center}.showOverviewPlaceholder img.pilotCuePlaceholder{width:44%!important;height:72%!important;max-width:120px!important;max-height:120px!important;object-fit:contain!important;opacity:1!important;border-radius:0!important}
.showOverviewRow>.editCue{position:absolute;top:10px;right:10px;z-index:3;width:28px;height:28px;min-width:28px;min-height:28px;display:grid;place-items:center;padding:0!important}.overviewHeading .overviewName{padding-right:28px}
</style></head><body class="locked showLayoutIceman"><main class="spectaclePriorityLayout"><section class="card timelineCard"><div class="timelineTransport"><div class="showTransportHeader"><div class="bridgeShowHeading"><h2 class="timelineShowTitle" id="title"></h2><div id="liveFinishEstimate" class="muted" hidden></div></div><div class="showNextCountdown" id="showNextCountdown"><span class="showCountdownLabel"></span><span class="showCountdownClock">--:--</span><span class="overviewBeat"></span></div></div><div class="row"><div id="generalTimelineViewport"><div class="timeline" id="timeline"><div id="progress" class="progress"></div></div></div><span class="transportClock"><span class="time" id="clock">00:00</span><span class="muted" id="duration"></span></span></div><div id="standbyNotice"></div></div></section><div class="showWorkspace"><section class="card showCueOverview"><div class="bridgeCueHeading"><h2>CUES</h2><details id="cueTypeFilter"><summary id="cueTypeFilterLabel"></summary><div id="cueTypeChoices"></div><button id="cueTypeAll" type="button"></button></details></div><div id="showCueOverviewRows"></div></section></div></main><script src="show.js"></script></body></html>
