<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S2A Pilot Bridge — Show</title><style>
*{box-sizing:border-box}body{margin:0;background:#0f131a;color:#f4f6f8;font:15px system-ui}header{height:60px;display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid #2a303b}header img{width:36px;height:36px;border-radius:7px}header strong{font-size:18px}#status{margin-left:auto;color:#a9bbd0}#status.lost{color:#ff746b}.workspace{display:flex;height:calc(100vh - 60px)}aside{width:230px;flex:none;overflow:auto;padding:16px 12px;border-right:1px solid #2a303b}h2{font-size:12px;letter-spacing:.1em;color:#a9bbd0;margin:4px 0 18px}#flow{display:grid;gap:9px}.flowItem{padding:12px;border:1px solid #2a303b;border-radius:10px;overflow-wrap:anywhere;background:#161c26}.flowItem .kind{font-size:11px;color:#9eb2c9;margin-bottom:5px}.flowItem.active{background:#1b2c43;border-color:#91c4ff;box-shadow:0 0 12px #398fff55}.flowItem{width:100%;color:inherit;font:inherit;text-align:left;cursor:pointer}.flowItem:focus-visible{outline:2px solid #91c4ff;outline-offset:2px}.flowItem .rowTitle{display:flex;gap:8px;align-items:center}.flowItem .play{color:#40db7a}.flowItem .number{font-variant-numeric:tabular-nums;color:#b5c9e3}.flowItem:disabled{cursor:default;opacity:.7}.flowItem.paused{border-style:dashed}iframe{border:0;flex:1;min-width:0}#zoom{position:fixed;inset:0;background:#05070af5;z-index:1000;border:0;padding:20px;margin:0;width:100vw;height:100vh;cursor:zoom-out;display:flex;align-items:center;justify-content:center}#zoom[hidden]{display:none}#zoom img{width:100%;height:100%;object-fit:contain}#zoom button{position:absolute;right:24px;top:20px;background:#1b2432;color:#fff;padding:12px 18px;border:1px solid #657b98;border-radius:9px;font:inherit;cursor:pointer}#zoom .hint{position:absolute;bottom:14px;background:#111b;padding:6px 14px;border-radius:8px} @media(max-width:760px){aside{width:165px;padding:10px 6px}header{padding:8px 12px;font-size:12px}.flowItem{padding:9px}#status{max-width:160px;text-align:right}}

</style></head><body><header><img src="bridge.png" alt=""><strong>S2A Pilot Bridge · Show</strong><span id="status" role="status"></span></header><div class="workspace"><aside><h2 id="flowTitle"></h2><div id="flow"></div></aside><iframe id="show" src="show.html" title="Show Maverick"></iframe></div><div id="zoom" hidden role="dialog" aria-modal="true"><img alt=""><button type="button"></button><span class="hint"></span></div><dialog id="editor" aria-labelledby="editTitle"><form id="editForm"><h2 id="editTitle"></h2><p id="editHelp"></p><label for="editName" id="editNameLabel"></label><input id="editName" autocomplete="off"><label for="editDescription" id="editDescriptionLabel"></label><textarea id="editDescription" rows="5"></textarea><p id="editError" role="status" aria-live="polite"></p><footer><button type="button" id="editCancel"></button><button type="submit" id="editSave"></button></footer></form></dialog><script src="shell.js"></script></body></html>
