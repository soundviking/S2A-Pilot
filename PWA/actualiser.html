<!doctype html><html lang="fr"><meta charset="utf-8"><title>Actualisation S2A Pilot</title><body><p id="status">Actualisation de S2A Pilot… Vos projets locaux sont conservés.</p><script>
(async()=>{try{const registrations=await navigator.serviceWorker.getRegistrations();await Promise.all(registrations.filter(r=>r.scope===new URL('./',location.href).href).map(r=>r.unregister()));const names=await caches.keys();await Promise.all(names.filter(n=>n.startsWith('s2a-pilot-')||n.startsWith('showcue-')).map(n=>caches.delete(n)));location.replace('./?version=1.4.25&refresh='+Date.now());}catch(e){document.getElementById('status').textContent='Actualisation impossible : '+e.message;}})();
</script></body></html>
