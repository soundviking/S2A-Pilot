<!doctype html><html lang="fr"><meta charset="utf-8"><title>Actualisation S2A Pilot</title><body><p id="status">Actualisation de S2A Pilot… Vos projets locaux sont conservés.</p><script>
(async()=>{const en=(localStorage.getItem('s2a-language')||((navigator.language||'en').startsWith('fr')?'fr':'en'))==='en';if(en)document.getElementById('status').textContent='Updating S2A Pilot… Your local projects are preserved.';try{if(navigator.serviceWorker){const registrations=await navigator.serviceWorker.getRegistrations();await Promise.all(registrations.filter(r=>r.scope===new URL('./',location.href).href).map(r=>r.unregister()));}if(window.caches){const names=await caches.keys();await Promise.all(names.filter(n=>/^(s2a-pilot-|showcue-|chokyu)/i.test(n)).map(n=>caches.delete(n)));}location.replace('./index.html?version=1.4.62&refresh='+Date.now());}catch(e){document.getElementById('status').textContent=(en?'Update failed: ':'Actualisation impossible : ')+e.message;}})();
</script></body></html>
