<!doctype html><html lang="fr"><meta charset="utf-8"><title>Actualisation S2A Pilot</title><body><p id="status">Actualisation de S2A Pilot… Vos projets locaux sont conservés.</p><script src="./i18n-catalog.js?v=1.5.7"></script><script>
(async()=>{document.documentElement.lang=S2AStrings.language();document.title=S2AStrings.text('Actualisation S2A Pilot');document.getElementById('status').textContent=S2AStrings.text('Actualisation de S2A Pilot… Vos projets locaux sont conservés.');try{if(navigator.serviceWorker){const registrations=await navigator.serviceWorker.getRegistrations();await Promise.all(registrations.filter(r=>r.scope===new URL('./',location.href).href).map(r=>r.unregister()));}if(window.caches){const names=await caches.keys();await Promise.all(names.filter(n=>/^(s2a-pilot-|showcue-|chokyu)/i.test(n)).map(n=>caches.delete(n)));}location.replace('./index.html?version=1.5.7&refresh='+Date.now());}catch(e){document.getElementById('status').textContent=S2AStrings.text('Actualisation impossible : ')+e.message;}})();
</script></body></html>
